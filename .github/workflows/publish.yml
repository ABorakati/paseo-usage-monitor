name: Publish

# Publishes to npm when a GitHub release is published. Uses npm trusted publishing
# (OIDC): no npm token is stored, and npm attaches a provenance attestation that
# links the tarball to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - run: npm ci --include=dev
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Check the release tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm publish --access public
